# Exam-night config for dadrose.com on nginx + PHP-FPM (G2).
# Use ONLY if the host runs nginx in front of PHP-FPM. For LiteSpeed/OpenLiteSpeed or
# Apache, follow the matching section of README.md instead; for a CDN (ArvanCloud,
# Cloudflare) the edge rules in README.md §3 do the same job.
#
# What it does, for the two exam-night URLs only:
#   1. Full-page cache for 60s, served stale while refreshing or when PHP errors.
#   2. Logged-in users and WooCommerce cookies bypass the cache (no one sees another's page).
#   3. If PHP-FPM still fails (502/503/504), serve the static snapshot from
#      /var/www/exam-fallback (made by make-static-fallback.sh).
#
# Test before reload:  sudo nginx -t && sudo systemctl reload nginx
# Roll back: remove the include line and reload.

# ---- http {} level (e.g. /etc/nginx/conf.d/exam-cache.conf) ----
fastcgi_cache_path /var/cache/nginx/exam levels=1:2 keys_zone=EXAM:20m max_size=200m inactive=2h use_temp_path=off;
# $uri, not $request_uri: the query string is left out, so «?utm_source=telegram» and every other shared-link
# variant hit the same cached copy instead of each going to PHP on exam night. Safe only because the two cached
# URLs below render the same page for every query string (?preview is bypassed explicitly).
fastcgi_cache_key "$scheme$request_method$host$uri";

map $http_cookie $exam_skip_cache {
    default 0;
    ~*wordpress_logged_in_ 1;
    ~*woocommerce_items_in_cart 1;
    ~*wp_woocommerce_session_ 1;
    ~*comment_author_ 1;
}

# ---- server {} level, inside the dadrose.com server block, BEFORE the generic ~ \.php$ / location / ----
location ~ ^/(questions-and-answer-key-of-the-1405-bar-exam|score-percentage-calculator)/$ {
    # Everything goes through WordPress' front controller.
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_pass unix:/run/php/php-fpm.sock;   # ← match the socket/port used by your existing PHP location

    fastcgi_cache EXAM;
    fastcgi_cache_valid 200 60s;
    fastcgi_cache_methods GET HEAD;
    fastcgi_cache_bypass $exam_skip_cache $arg_preview;
    fastcgi_no_cache $exam_skip_cache $arg_preview;
    fastcgi_cache_use_stale error timeout updating invalid_header http_500 http_503;
    fastcgi_cache_background_update on;
    fastcgi_cache_lock on;                     # one request refreshes, the rest wait/stale
    fastcgi_ignore_headers Cache-Control Expires Set-Cookie;
    add_header X-Cache-Status $upstream_cache_status always;

    fastcgi_intercept_errors on;
    # =503: the visitor sees the snapshot, but crawlers get «temporarily unavailable», so Google keeps the
    # real page in its index instead of indexing a possibly older snapshot (a 200 here would replace it).
    error_page 502 503 504 =503 @exam_fallback;
}

location @exam_fallback {
    root /var/www/exam-fallback;
    try_files $uri/index.html $uri =503;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "120" always;
    add_header X-Robots-Tag "noindex, noarchive" always;
    add_header X-Exam-Fallback "1" always;
}

# OPTIONAL, only if the server block has no static-asset rule yet (nginx -t will complain
# about a duplicate location otherwise). Long browser cache so repeat visits skip PHP.
location ~* \.(css|js|woff2?|png|jpe?g|webp|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, max-age=2592000" always;
    try_files $uri =404;
}
